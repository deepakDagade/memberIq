spring.application.name=memberiq
server.servlet.context-path=/memberiq

##  DB Details
spring.datasource.url=jdbc:postgresql://localhost:5432/membr_iq
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

template.web-app-url=http://localhost:8080/memberiq
security.permit.post-urls=/users/forgot,/users/reset
security.permit.logout-url=http://localhost:8080/memberiq/logout
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/memberiq
#Endpoint Scopes
app.endpoint.scopes.[/api/admin/**]=create:admin,update:admin,delete:admin,read:admin
app.endpoint.scopes.[/api/admin/organizations/**]=create:organization,update:organization,delete:organization,read:organization
app.endpoint.scopes.[/api/users/**]=read:user,update:user,delete:user
