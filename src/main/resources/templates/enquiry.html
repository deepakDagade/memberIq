<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Enquiry Form</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<style>
		.enquiry-container {
			background-color: white;
			border-radius: 16px;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
			overflow: hidden;
		}

		.form-section {
			padding: 2rem;
		}

		.form-control {
			border-radius: 0.5rem;
		}

		.enquiry-title {
			font-size: 1.5rem;
			font-weight: bold;
		}

		.highlight {
			color: #007bff;
			font-weight: bold;
		}

		.send-btn {
			background-color: #007bff;
			color: white;
			font-weight: bold;
			border-radius: 0.5rem;
		}

		.bullet-points {
			margin-top: 1rem;
			font-size: 0.9rem;
			color: #555;
		}

		.bullet-points li::marker {
			color: #007bff;
		}

		.enquiry-image {
			object-fit: cover;
			width: 100%;
			height: 100%;
		}

		@media (max-width: 768px) {
			.enquiry-image {
				display: none;
			}
		}
	</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
	<div class="container enquiry-container">
		<div class="row g-0">
			<!-- Form Section -->
			<div class="col-md-6 form-section">
				<div class="enquiry-title mb-3">
					Get the list of best <span class="highlight">Home Tutors For English Language</span>
				</div>

				<form th:action="@{'/enquiry/' + ${organizationId}}" method="post" th:object="${frontOffice}">
					<div class="mb-3">
						<input type="text" class="form-control" placeholder="Name*" th:field="*{name}" required>
					</div>
					<div class="mb-3">
						<input type="text" class="form-control" placeholder="Mobile Number*" th:field="*{phoneNo}"
							required>
					</div>
					<div class="mb-3">
						<input type="email" class="form-control" placeholder="Email ID (Optional)" th:field="*{email}">
					</div>
					<div class="mb-3">
						<input type="text" class="form-control" placeholder="Comment" th:field="*{comment}">
					</div>
					<button type="submit" class="btn send-btn w-100">SEND ENQUIRY</button>
				</form>

				<ul class="bullet-points mt-4">
					<li>Businesses compete with each other to get you the Best Deal</li>
					<li>You choose whichever suits you best</li>
					<li>Contact info will be sent to you by SMS/Email</li>
				</ul>
			</div>

			<!-- Image Section -->
			<div class="col-md-6 d-none d-md-block">
				<img src="/images/home-tutor-banner.png" alt="Enquiry Illustration" class="enquiry-image">

			</div>
		</div>
	</div>
</body>

</html>
