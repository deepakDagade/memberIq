<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
  <head>
    <title>Welcome to CarboniQ</title>
    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body class="bg-black h-screen m-0 p-0 flex items-center justify-center">
    <!-- Main Container -->
    <div class="flex flex-col lg:flex-row bg-white overflow-hidden w-full h-full">
      
      <!-- Left Section: Login Form -->
      <div class="flex-1 p-0 flex items-center justify-center h-full">
        <div class="w-full px-4 sm:px-8 lg:px-8 xl:px-8">
          <h1 class="text-[34px] sm:text-[20px] lg:text-[30px] xl:text-[30px] font-semibold text-gray-900 flex items-center justify-center lg:justify-center sm:mb-4">
            Welcome to
            <img src="css/carbon.svg" class="mt-1 sm:max-h-[20px] lg:max-h-[30px] xl:max-h-[30px] sm:w-[120px] lg:w-[150px] xl:w-[150px] lg:ml-[.5rem] xl:ml-[.5rem] sm:ml-2">
          </h1>
          <h2 class="text-[20px] sm:text-[18px] lg:text-[22px] xl:text-[22px] text-gray-600 mb-6 text-center lg:text-left font-semibold">Login</h2>

         
          <!-- Login Form -->
          <form th:action="@{/login}" method="POST">
            <!-- Email Field -->
            <div class="mb-4 flex justify-center">
              <input type="text" id="username" name="username" required placeholder="Email"
                class="mt-2 p-4 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent bg-[#f7f7f7] text-[16px] sm:text-[18px] lg:text-[18px] xl:text-[18px] sm:w-[80%] lg:w-[100%] mx-auto lg:mx-0">
            </div>

            <!-- Password Field -->
            <div class="mb-6 flex justify-center">
              <input type="password" id="password" name="password" required placeholder="Password"
                class="mt-2 p-4 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent bg-[#f7f7f7] text-[16px] sm:text-[18px] lg:text-[18px] xl:text-[18px] sm:w-[80%] lg:w-[100%] mx-auto lg:mx-0">
            </div>

            <!-- Forgot Password Link -->
            <div class="flex justify-end items-center mb-6">
              <a th:href="@{${webAppUrl} + '/forgot-password'}" class="text-[16px] sm:text-[18px] lg:text-[18px] xl:text-[18px] text-[#6E6E6E] hover:underline">Forget Password?</a>
            </div>

            <!-- Error Message (Initially Hidden) -->
            <div id="errorMessage" th:if="${param.error}" class="text-red-600 text-center mb-4">
                       Invalid Credentials. Please try again.
                     </div>
              
            <!-- Login Button -->
            <div class="flex sm:justify-center">
              <button type="submit"
                class="w-full bg-[#00598A] text-white py-3 rounded-lg hover:bg-gray-600 transition duration-200 text-[18px] sm:text-[20px] lg:text-[20px] xl:text-[20px] sm:w-[80%] lg:w-[100%] mx-auto lg:mx-0 mb-8">Login</button>
            </div>
          </form>

          <!-- Footer -->
          <div class="flex justify-center lg:justify-center items-end flex-grow xl:mt-10">
            <div class="flex items-center justify-center text-center text-[14px] sm:text-[16px] lg:text-[18px] xl:text-[18px] text-gray-600 mb-4">
              <span class="mr-2">Powered by</span>
              <strong class="text-blue-600"></strong>
              <img src="css/netzero.svg" class="w-[150px] h-[30px] sm:h-[40px] lg:h-[50px] xl:h-[60px] max-w-full">
            </div>
          </div>
        </div>
      </div>

      <!-- Right Section: Background Image -->
      <div class="flex-1 rounded-l-[1rem] lg:mt-0 bg-black mb-0 h-full">
        <div class="flex items-center justify-center h-full w-full">
          <img src="css/loginBG.png" alt="Background Image" class="object-cover w-full h-full rounded-l-[1rem]">
        </div>
      </div>
    </div>
    
    <script>
          document.addEventListener("DOMContentLoaded", function () {
            const errorMessage = document.getElementById("errorMessage");
            if (errorMessage) {
              setTimeout(() => {
                errorMessage.style.display = "none";
              }, 2000); // Hides message after 2 seconds
            }
          });
        </script>
        
  </body>
</html>
